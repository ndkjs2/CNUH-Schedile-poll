<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행사 일정 조율 — CNHU</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:   #1E3A5F;
    --navy-l: #2E5280;
    --blue:   #3498DB;
    --blue-l: #EBF5FB;
    --green:  #1A6B3C;
    --green-l:#E8F5EE;
    --green-b:#27AE60;
    --red:    #C0392B;
    --red-l:  #FDECEA;
    --gray-0: #FFFFFF;
    --gray-1: #F7F9FC;
    --gray-2: #EEF2F7;
    --gray-3: #D6E4F0;
    --gray-4: #8B9BB0;
    --gray-5: #4A5568;
    --gray-6: #1A202C;
    --shadow: 0 2px 16px rgba(30,58,95,0.09);
    --radius: 12px;
  }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif; background:var(--gray-1); color:var(--gray-6); min-height:100vh; }

  /* 헤더 */
  header { background:linear-gradient(135deg,#163054 0%,#2E5280 100%); padding:28px 24px 24px; text-align:center; }
  header .eyebrow { font-size:11px; letter-spacing:1.5px; color:#7FA8CC; margin-bottom:10px; text-transform:uppercase; }
  header h1 { font-size:22px; font-weight:700; color:#fff; margin-bottom:6px; }
  header .sub { font-size:14px; color:#9ECAE1; margin-bottom:20px; }
  .progress-wrap { display:inline-flex; align-items:center; gap:12px; background:rgba(255,255,255,0.1); border-radius:99px; padding:8px 20px; flex-wrap:wrap; justify-content:center; }
  .prog-text { font-size:13px; color:#BCD9ED; }
  .prog-num { font-size:20px; font-weight:700; color:#fff; }
  .prog-num span { color:#27AE60; }
  .prog-bar-outer { width:100px; height:6px; background:rgba(255,255,255,0.2); border-radius:99px; overflow:hidden; }
  .prog-bar-inner { height:100%; background:#27AE60; border-radius:99px; transition:width 0.4s ease; width:0%; }

  /* 실시간 바 */
  .sync-bar { display:flex; align-items:center; justify-content:space-between; background:var(--green-l); border-bottom:1px solid #A8D5BC; padding:8px 20px; font-size:12px; flex-wrap:wrap; gap:6px; }
  .sync-left { display:flex; align-items:center; gap:7px; color:var(--green); font-weight:500; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--green-b); animation:pulse 2s infinite; }
  .sync-right { color:var(--green); opacity:0.75; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* 본문 */
  main { max-width:560px; margin:0 auto; padding:24px 16px 60px; }

  /* 카드 */
  .card { background:var(--gray-0); border:1px solid var(--gray-3); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card-title { font-size:14px; font-weight:600; color:var(--navy); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }

  /* 등록 폼 */
  .form-row { display:flex; gap:8px; align-items:center; }
  .form-row input { flex:1; height:40px; border:1px solid var(--gray-3); border-radius:8px; padding:0 12px; font-size:14px; color:var(--gray-6); background:var(--gray-1); outline:none; transition:border-color 0.15s; }
  .form-row input:focus { border-color:var(--blue); background:#fff; }
  .btn { height:40px; padding:0 20px; border-radius:8px; border:none; background:var(--navy); color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:background 0.15s; white-space:nowrap; }
  .btn:hover { background:var(--navy-l); }
  .btn:active { transform:scale(0.97); }
  .err { font-size:12px; color:var(--red); margin-top:8px; min-height:16px; }

  /* 참석자 태그 */
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px; background:var(--blue-l); color:var(--navy); font-size:12px; font-weight:600; border:1px solid var(--gray-3); }
  .tag button { background:none; border:none; cursor:pointer; color:var(--gray-4); font-size:14px; line-height:1; padding:0; display:flex; align-items:center; }
  .tag button:hover { color:var(--red); }

  /* 날짜 정보 카드 */
  .date-info { background:var(--gray-0); border:1px solid var(--gray-3); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .date-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .date-label { font-size:18px; font-weight:700; color:var(--navy); }
  .date-dow { font-size:12px; color:var(--gray-4); margin-bottom:8px; }
  .time-pill { display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:99px; background:#EBF2FA; color:var(--navy); font-size:12px; font-weight:600; border:1px solid var(--gray-3); }
  .count-summary { display:flex; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--gray-2); }
  .count-box { flex:1; text-align:center; }
  .count-big { font-size:28px; font-weight:700; line-height:1; }
  .count-big.green { color:var(--green); }
  .count-big.red   { color:var(--red); }
  .count-sub { font-size:11px; color:var(--gray-4); margin-top:3px; }

  /* 참석자별 응답 리스트 */
  .section-lbl { font-size:12px; font-weight:600; color:var(--gray-4); letter-spacing:0.4px; margin-bottom:10px; }
  .person-list { display:flex; flex-direction:column; gap:8px; }
  .person-row { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--gray-0); border:1px solid var(--gray-3); border-radius:10px; box-shadow:0 1px 4px rgba(30,58,95,0.05); }
  .person-row.available { border-color:#A8D5BC; background:var(--green-l); }
  .person-row.unavailable { border-color:#F5C6C2; background:var(--red-l); }
  .person-name { font-size:14px; font-weight:600; color:var(--gray-6); }
  .btn-group { display:flex; gap:6px; }
  .btn-avail { height:32px; padding:0 14px; border-radius:6px; border:1.5px solid; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; background:transparent; }
  .btn-avail.yes { border-color:var(--green); color:var(--green); }
  .btn-avail.yes.active { background:var(--green); color:#fff; }
  .btn-avail.yes:hover { background:var(--green-l); }
  .btn-avail.yes.active:hover { background:#155e34; }
  .btn-avail.no { border-color:var(--red); color:var(--red); }
  .btn-avail.no.active { background:var(--red); color:#fff; }
  .btn-avail.no:hover { background:var(--red-l); }
  .btn-avail.no.active:hover { background:#a93226; }
  .no-person { font-size:13px; color:var(--gray-4); text-align:center; padding:20px 0; }

  /* 요약 */
  .summary-row { display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--gray-2); font-size:13px; }
  .summary-row:last-child { border-bottom:none; }
  .sum-lbl { font-weight:600; }
  .sum-lbl.green { color:var(--green); }
  .sum-lbl.red   { color:var(--red); }
  .sum-names { color:var(--gray-5); text-align:right; max-width:320px; line-height:1.6; }
  .sum-none { color:var(--gray-4); }

  /* 로딩 */
  #loading { position:fixed; inset:0; background:rgba(30,58,95,0.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }
  .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { color:#fff; font-size:14px; }

  /* 초기화 버튼 */
  .btn-reset { background:none; border:1px solid var(--gray-3); color:var(--gray-4); font-size:11px; padding:3px 10px; border-radius:6px; cursor:pointer; }
  .btn-reset:hover { border-color:var(--red); color:var(--red); }

  @media (max-width:480px) { header h1 { font-size:18px; } }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>데이터 불러오는 중...</p></div>

<header>
  <div class="eyebrow">CNHU · 행사 일정 조율</div>
  <h1>📅 참석 가능 여부를 알려주세요</h1>
  <p class="sub">10월 6일 (화요일) · 저녁 19:00</p>
  <div class="progress-wrap">
    <span class="prog-text">응답 완료</span>
    <span class="prog-num"><span id="reg-count">0</span> / 11명</span>
    <div class="prog-bar-outer"><div class="prog-bar-inner" id="prog-bar"></div></div>
  </div>
</header>

<div class="sync-bar">
  <div class="sync-left"><span class="sync-dot"></span>실시간 동기화 중 — 누구나 이 링크에서 같은 현황을 볼 수 있습니다</div>
  <span class="sync-right" id="sync-time">연결 중...</span>
</div>

<main>
  <!-- 참석자 등록 -->
  <div class="card">
    <div class="card-title">
      참석자 등록
      <div style="display:flex;gap:8px;align-items:center">
        <span id="prog-pill" style="font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--blue-l);color:var(--navy)">0 / 11명</span>
        <button class="btn-reset" onclick="resetAll()">초기화</button>
      </div>
    </div>
    <div class="form-row">
      <input id="inp-name" type="text" placeholder="이름을 입력하세요" maxlength="20">
      <button class="btn" onclick="addPerson()">등록</button>
    </div>
    <div class="err" id="err-msg"></div>
    <div class="tags" id="reg-tags"></div>
  </div>

  <!-- 날짜 정보 + 현황 -->
  <div class="date-info">
    <div class="date-top">
      <div>
        <div class="date-label">10월 6일</div>
        <div class="date-dow">화요일</div>
      </div>
      <div class="time-pill">🕖 저녁 19:00</div>
    </div>
    <div class="count-summary">
      <div class="count-box">
        <div class="count-big green" id="yes-count">0</div>
        <div class="count-sub">참석 가능</div>
      </div>
      <div style="width:1px;background:var(--gray-2)"></div>
      <div class="count-box">
        <div class="count-big red" id="no-count">0</div>
        <div class="count-sub">참석 불가</div>
      </div>
      <div style="width:1px;background:var(--gray-2)"></div>
      <div class="count-box">
        <div class="count-big" style="color:var(--gray-4)" id="pending-count">0</div>
        <div class="count-sub">미응답</div>
      </div>
    </div>
  </div>

  <!-- 참석자별 응답 -->
  <div class="section-lbl" id="person-section-lbl" style="display:none">참석자별 응답</div>
  <div class="person-list" id="person-list"></div>

  <!-- 요약 -->
  <div class="card" id="summary" style="display:none;margin-top:16px">
    <div class="card-title">참석 현황 요약</div>
    <div id="sum-body"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyBGrSZjUiuOJL6dQH__PdD8_sYBkrYA-gA",
  authDomain:        "cnhu-schedule-poll.firebaseapp.com",
  databaseURL:       "https://cnhu-schedule-poll-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "cnhu-schedule-poll",
  storageBucket:     "cnhu-schedule-poll.firebasestorage.app",
  messagingSenderId: "242734240479",
  appId:             "1:242734240479:web:d5aa3c0b6e13e737f84f6a",
});
const db   = firebase.database();
const ROOT = db.ref("schedule_poll_oct6"); // 새 키로 기존 데이터와 분리

const TOTAL = 11;
const DAY   = "d1006";

// persons: ["이름1","이름2",...]
// checks:  { "d1006__이름": true(가능)/false(불가)/undefined(미응답) }
let persons = [];
let checks  = {};
let saving  = false;

async function saveToFirebase() {
  if (saving) return;
  saving = true;
  try { await ROOT.set({ persons, checks }); updateSync(); }
  catch(e) { console.error(e); }
  saving = false;
}

ROOT.on("value", snap => {
  const d = snap.val();
  if (d) { persons = d.persons || []; checks = d.checks || {}; }
  else   { persons = []; checks = {}; }
  render();
  updateSync();
  document.getElementById('loading').style.display = 'none';
});

function updateSync() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('sync-time').textContent = `${hh}:${mm}:${ss} 동기화됨`;
}

// ── 액션 ─────────────────────────────────────────────────────
window.addPerson = function() {
  const inp = document.getElementById('inp-name');
  const err = document.getElementById('err-msg');
  const name = inp.value.trim();
  err.textContent = '';
  if (!name) { err.textContent = '이름을 입력해 주세요.'; return; }
  if (persons.includes(name)) { err.textContent = '이미 등록된 이름입니다.'; return; }
  if (persons.length >= TOTAL) { err.textContent = `최대 ${TOTAL}명까지 등록할 수 있습니다.`; return; }
  persons.push(name);
  inp.value = '';
  saveToFirebase();
};

window.removePerson = function(name) {
  if (!confirm(`"${name}"을(를) 삭제할까요?`)) return;
  persons = persons.filter(p => p !== name);
  const k = `${DAY}__${name}`;
  delete checks[k];
  saveToFirebase();
};

window.respond = function(name, val) {
  // val: true=가능, false=불가, null=취소
  const k = `${DAY}__${name}`;
  if (checks[k] === val) { delete checks[k]; } // 같은 버튼 다시 누르면 취소
  else { checks[k] = val; }
  saveToFirebase();
};

window.resetAll = function() {
  if (!confirm('모든 데이터를 초기화할까요?')) return;
  persons = []; checks = {};
  saveToFirebase();
};

// ── 렌더 ─────────────────────────────────────────────────────
function render() {
  const n = persons.length;
  document.getElementById('reg-count').textContent = n;
  document.getElementById('prog-bar').style.width = Math.round(n / TOTAL * 100) + '%';
  document.getElementById('prog-pill').textContent = `${n} / ${TOTAL}명`;
  renderTags();
  renderPersonList();
  renderSummary();
}

function renderTags() {
  document.getElementById('reg-tags').innerHTML = persons.map(p =>
    `<span class="tag">${p}<button onclick="removePerson('${p}')" aria-label="${p} 삭제">✕</button></span>`
  ).join('');
}

function renderPersonList() {
  const list = document.getElementById('person-list');
  const lbl  = document.getElementById('person-section-lbl');

  const yesArr = persons.filter(p => checks[`${DAY}__${p}`] === true);
  const noArr  = persons.filter(p => checks[`${DAY}__${p}`] === false);
  const pending = persons.filter(p => checks[`${DAY}__${p}`] === undefined);

  document.getElementById('yes-count').textContent     = yesArr.length;
  document.getElementById('no-count').textContent      = noArr.length;
  document.getElementById('pending-count').textContent = pending.length;

  if (persons.length === 0) {
    lbl.style.display = 'none';
    list.innerHTML = `<div class="no-person">참석자를 먼저 등록해 주세요</div>`;
    return;
  }
  lbl.style.display = 'block';

  list.innerHTML = '';
  persons.forEach(p => {
    const k   = `${DAY}__${p}`;
    const val = checks[k]; // true / false / undefined
    const row = document.createElement('div');
    row.className = 'person-row' + (val === true ? ' available' : val === false ? ' unavailable' : '');
    row.innerHTML = `
      <span class="person-name">${p}</span>
      <div class="btn-group">
        <button class="btn-avail yes${val === true ? ' active' : ''}" onclick="respond('${p}', true)">✓ 가능</button>
        <button class="btn-avail no${val === false ? ' active' : ''}" onclick="respond('${p}', false)">✕ 불가</button>
      </div>`;
    list.appendChild(row);
  });
}

function renderSummary() {
  const el   = document.getElementById('summary');
  const body = document.getElementById('sum-body');
  if (persons.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';

  const yesArr = persons.filter(p => checks[`${DAY}__${p}`] === true);
  const noArr  = persons.filter(p => checks[`${DAY}__${p}`] === false);
  const pending = persons.filter(p => checks[`${DAY}__${p}`] === undefined);

  body.innerHTML = [
    { label:'✓ 참석 가능', cls:'green', names: yesArr },
    { label:'✕ 참석 불가', cls:'red',   names: noArr  },
    { label:'⏳ 미응답',    cls:'',      names: pending },
  ].map(r => `
    <div class="summary-row">
      <span class="sum-lbl ${r.cls}">${r.label} (${r.names.length}명)</span>
      <span class="${r.names.length > 0 ? 'sum-names' : 'sum-none'}">
        ${r.names.length > 0 ? r.names.join(', ') : '—'}
      </span>
    </div>`).join('');
}

document.getElementById('inp-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.addPerson();
  document.getElementById('err-msg').textContent = '';
});
</script>
</body>
</html>
